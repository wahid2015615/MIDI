[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midigen-backend"
version = "0.1.0"
description = "Feature-based FastAPI MIDI generation backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mido>=1.3.2",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.0",
  "llama-cpp-python>=0.3.0",
]

[project.scripts]
midi-gen = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
markers = [
  "unit: fast tests with no HTTP TestClient (theory, engine, composers)",
  "integration: FastAPI TestClient / Studio-shaped generate payloads",
  "security: auth, CORS, filename, input-cap, probe gates",
]
